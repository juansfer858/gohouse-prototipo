<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Panel</title>
  <style>html,body{margin:0;min-height:100%;background:#0f1b2b}body{visibility:hidden}</style>
</head>
<body>
<script>
(async()=>{
  try{
    async function fetchPanelHtml(){
      let lastError=null;
      for(let attempt=1; attempt<=4; attempt++){
        const controller=new AbortController();
        const timer=setTimeout(()=>controller.abort(),12000);
        try{
          const res=await fetch('/gohouse-panel.html?loader=20260925.46',{cache:'no-store',signal:controller.signal});
          if(!res.ok) throw new Error('HTTP '+res.status);
          return await res.text();
        }catch(e){
          lastError=e;
          if(attempt<4) await new Promise(resolve=>setTimeout(resolve,500*attempt));
        }finally{
          clearTimeout(timer);
        }
      }
      throw lastError || new Error('PANEL_FETCH_FAILED');
    }
    let html=await fetchPanelHtml();
    html=html.replace(/<head([^>]*)>/i,'<head$1><base href="/">');

    const nativeQr=/(<button[^>]*id=["']tab-qr["'][^>]*>)[\s\S]*?(<\/button>)/i;
    if(nativeQr.test(html)){
      html=html.replace(nativeQr,'<button class="btn btn-ghost" id="tab-qr" style="flex:1;" onclick="location.href=\'/qr/\'">📱 QR pedidos y operadores</button>');
    }
    html=html.replace(/<button[^>]*id=["']tab-qr-public["'][^>]*>[\s\S]*?<\/button>/ig,'');

    if(!/id=["']tab-publicidad["']/i.test(html)){
      const adsButton='<button class="btn btn-ghost" id="tab-publicidad" style="flex:1;min-width:150px;">📣 Publicidad</button>';
      const qrButton=/(<button[^>]*id=["']tab-qr["'][^>]*>[\s\S]*?<\/button>)/i;
      const configButton=/(<button[^>]*id=["']tab-ajustes["'][^>]*>[\s\S]*?<\/button>)/i;
      if(qrButton.test(html)) html=html.replace(qrButton,adsButton+'$1');
      else if(configButton.test(html)) html=html.replace(configButton,adsButton+'$1');
    }

    if(!/gohouse-publicidad\.js/i.test(html)){
      const adsBridge='<script>(function(){window.loadShared=async function(){const snap=await dbRef.once(\'value\');return snap.val()||{};};window.saveShared=async function(next){await dbRef.set(next);try{data=next;}catch(e){}};})();<\/script>';
      html=html.replace(/<\/body>/i,adsBridge+'<script src="/gohouse-publicidad.js" defer><\/script></body>');
    }

    if(!/gohouse-panel-nav\.js/i.test(html)){
      html=html.replace(/<\/body>/i,'<script src="/gohouse-panel-nav.js" defer><\/script></body>');
    }
    if(!/gohouse-mail-config\.js/i.test(html)){
      html=html.replace(/<\/body>/i,'<script src="/gohouse-mail-config.js?v=20260919.35" defer><\/script></body>');
    }

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error('[panel loader]',e);
    document.body.style.visibility='visible';
    document.body.innerHTML='<main style="font:16px system-ui;color:#fff;padding:32px;max-width:560px"><h2 style="margin:0 0 10px">No se pudo abrir el panel</h2><p style="opacity:.8;line-height:1.5">La conexión al panel falló después de varios intentos. El servidor puede seguir activo; revisa la conexión y vuelve a intentar.</p><button onclick="location.reload()" style="margin-top:10px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer">Reintentar</button></main>';
  }
})();
</script>
</body>
</html>
