name: Verify publicidad DB media v40
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/verify-publicidad-db-media-v40.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify v40 in production without writes
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          for i in $(seq 1 36); do
            curl -fsS "$BASE/api/health" -o /tmp/health.json || true
            if python3 - <<'PY'
          import json,sys
          try:
            h=json.load(open('/tmp/health.json'))
            sys.exit(0 if h.get('uploadMode')=='postgres-media-v40' else 1)
          except Exception:
            sys.exit(1)
          PY
            then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h.get('ok') is True and h.get('db') is True,h
          assert h.get('uploadMode')=='postgres-media-v40',h
          assert h.get('uploadStorageReady') is True,h
          print('health',h)
          PY
          media_code=$(curl -sS -o /tmp/media404 -w "%{http_code}" "$BASE/api/public/uploads/not-a-real-media-id")
          test "$media_code" = "404"
          upload_code=$(curl -sS -o /tmp/upload401 -w "%{http_code}" -X POST "$BASE/api/upload-data-url" -H 'Content-Type: application/json' --data '{"dataUrl":"data:image/png;base64,iVBORw0KGgo="}')
          test "$upload_code" = "401"
          echo "PASS: v40 running; media table query works; upload protected; writes=0"
