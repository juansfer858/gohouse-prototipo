name: E2E publicidad upload check
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/e2e-publicidad-upload-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: End-to-end tiny image upload
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          curl -fsS "$BASE/api/health" | tee /tmp/health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h.get('ok') is True and h.get('db') is True,h
          print('uploadMode',h.get('uploadMode'))
          PY
          curl -fsS -X POST "$BASE/api/auth/anonymous"             -H 'Content-Type: application/json'             --data '{"appKind":"client"}' > /tmp/auth.json
          TOKEN=$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/auth.json'))
          print(x['token'])
          PY
          )
          DATA='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          curl -fsS -X POST "$BASE/api/upload-data-url"             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             --data "$(python3 -c 'import json,os; print(json.dumps({"dataUrl":os.environ["DATA"]}))')"             > /tmp/upload.json
        env:
          DATA: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      - name: Verify public image
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          URL=$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/upload.json'))
          u=x.get('url','')
          assert u.startswith('/api/public/uploads/'),x
          print(u)
          PY
          )
          curl -fsS -D /tmp/h "$BASE$URL" -o /tmp/img
          grep -qi '^content-type: image/png' /tmp/h
          test -s /tmp/img
          echo "PASS: real tiny upload stored and publicly readable at $URL"
