name: Diagnose v32 release
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/diagnose-v32-release.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact manifest and sources
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,re,subprocess,urllib.request,tempfile,os
          m=json.loads(pathlib.Path('release/version.json').read_text())
          assert m['version']=='2026.09.18-white-label.32',m['version']
          for x in m['files']:
              mt=re.fullmatch(r'https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/([0-9a-f]{40})/(.+)',x['url'])
              assert mt,x['url']
              sha,p=mt.groups()
              b=subprocess.check_output(['git','show',sha+':'+p])
              got=hashlib.sha256(b).hexdigest()
              print(x['path'],'git',got,'expected',x['sha256'])
              assert got==x['sha256'],x['path']
              remote=urllib.request.urlopen(x['url'],timeout=20).read()
              got2=hashlib.sha256(remote).hexdigest()
              print(x['path'],'raw',got2)
              assert got2==x['sha256'],x['path']+' raw'
              tmp='/tmp/'+os.path.basename(x['path'])
              open(tmp,'wb').write(remote)
              if x['path'].endswith('.js'):
                  subprocess.check_call(['node','--check',tmp])
          print('PASS manifest')
          PY
