name: Package brand and permanent driver code v29
on:
  push:
    branches: ['fix/brand-permanent-driver-code-20260918']
    paths: ['.github/workflows/package-brand-driver-code.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brand-permanent-driver-code-20260918
          fetch-depth: 0
      - name: Build immutable release manifest
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess,datetime
          source='a7e28304c9cda5a081b72e004217bb830093d9fb'
          prefix='release/payload/brand-driver-code-1/'
          files=['server/src/server.js','web/gohouse-branding.js','web/gohouse-vps-adapter.js']
          migration='migrations/007_brand_driver_code.sql'
          def item(p):
              b=subprocess.check_output(['git','show',source+':'+prefix+p])
              assert pathlib.Path(prefix+p).read_bytes()==b,p
              return {'path':p,'url':'https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/'+source+'/'+prefix+p,'sha256':hashlib.sha256(b).hexdigest()}
          manifest={
            'version':'2026.09.18-white-label.29',
            'published_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'status':'release',
            'files':[item(p) for p in files],
            'delete':[],
            'migrations':[item(migration)]
          }
          pathlib.Path('release/version.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('release/BRAND_DRIVER_CODE_V29.md').write_text('''# V29 · marca visible y código permanente de domiciliarios

- La marca visible heredada se normaliza a Domicilios Llanos.
- El botón y la API de cambio de PIN quedan bloqueados.
- El código asignado al crear al domiciliario no se modifica por cierres o reinicios.
- La app conserva/restaura el acceso y renueva la sesión técnica con el mismo código.
- Eliminar al domiciliario invalida nuevos accesos y las sesiones existentes en API.
- No modifica pedidos, tarifas, caja, documentos, QR ni chat.
''')
          PY
      - name: Validate
        run: |
          node --check release/payload/brand-driver-code-1/server/src/server.js
          node --check release/payload/brand-driver-code-1/web/gohouse-branding.js
          node --check release/payload/brand-driver-code-1/web/gohouse-vps-adapter.js
          grep -q "2026.09.18-white-label.29" release/version.json
      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/version.json release/BRAND_DRIVER_CODE_V29.md
          git commit -m 'release(v29): permanent driver code and visible brand cleanup'
          git pull --rebase origin fix/brand-permanent-driver-code-20260918
          git push origin HEAD:fix/brand-permanent-driver-code-20260918

