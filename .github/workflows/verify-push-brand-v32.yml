name: Verify push brand v32
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/verify-push-brand-v32.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published push template without writes
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          for i in $(seq 1 30); do
            curl -fsS "$BASE/api/health" -o /tmp/health.json || true
            if python3 - <<'PY'
          import json,sys
          try:
            x=json.load(open('/tmp/health.json'))
            sys.exit(0 if x.get('pushTemplate')=='brand-v31' else 1)
          except Exception:
            sys.exit(1)
          PY
            then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/health.json'))
          assert x.get('ok') is True
          assert x.get('db') is True
          assert x.get('pushTemplate') == 'brand-v31', x
          print('health',x)
          PY
          curl -fsS "$BASE/api/public/config" -o /tmp/config.json
          python3 - <<'PY'
          import json,re
          x=json.load(open('/tmp/config.json'))
          name=str(x.get('brandName','')).strip()
          assert name == 'AGUILAS EXPRES', x
          assert not re.search(r'go!?\s*house|gohouse',name,re.I), name
          print('brand',name)
          PY
          echo "PASS: v32 running; brand dynamic; writes=0"
