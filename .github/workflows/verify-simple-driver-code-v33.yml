name: Verify simple driver code v33
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/verify-simple-driver-code-v33.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify published v33 without writes
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          for i in $(seq 1 36); do
            curl -fsS "$BASE/api/health" -o /tmp/health.json || true
            curl -fsS "$BASE/gohouse-driver-codes.js?release=20260918.33" -o /tmp/codes.js || true
            if python3 - <<'PY'
          import json,sys,pathlib
          try:
            h=json.load(open('/tmp/health.json'))
            c=pathlib.Path('/tmp/codes.js').read_text()
            ok=h.get('driverCodeMode')=='admin-set-v33' and 'Asignar código a' in c and 'No necesitas conocer el código anterior' in c
            sys.exit(0 if ok else 1)
          except Exception:
            sys.exit(1)
          PY
            then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json,pathlib
          h=json.load(open('/tmp/health.json'))
          c=pathlib.Path('/tmp/codes.js').read_text()
          assert h.get('ok') is True and h.get('db') is True
          assert h.get('driverCodeMode')=='admin-set-v33',h
          assert h.get('pushTemplate')=='brand-v31',h
          assert 'Asignar código a' in c
          assert 'No necesitas conocer el código anterior' in c
          assert 'Verificar y guardar' not in c
          print(h)
          PY
          node --check /tmp/codes.js
          status=$(curl -sS -o /tmp/protected.json -w "%{http_code}" "$BASE/api/driver-codes/test")
          test "$status" = "401"
          curl -fsS "$BASE/api/public/config" -o /tmp/config.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/config.json'))
          assert x.get('brandName')=='AGUILAS EXPRES',x
          PY
          echo "PASS: v33 published; direct code assignment UI; protected API; writes=0"
