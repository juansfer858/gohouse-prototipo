name: Prepare tariff release
on:
  push:
    branches: ['fix/tarifas-panel-20260915']
    paths: ['tools/prepare-tarifas-v2.py', '.github/workflows/prepare-tarifas-v2.yml']
permissions:
  contents: write
concurrency:
  group: prepare-tarifas-v2
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/tarifas-panel-20260915
      - name: Prepare exact patches without production writes
        run: python3 tools/prepare-tarifas-v2.py
      - name: Check generated JavaScript
        run: |
          node --check release/payload/tarifas-2/server/src/server.js
          node --check release/payload/tarifas-2/server/src/tarifas.js
          node --check release/payload/tarifas-2/web/gohouse-tarifas.js
          node --check release/payload/tarifas-2/web/gohouse-branding.js
      - name: Commit only isolated generated sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/payload/tarifas-2 tests/tarifas/fixtures
          if ! git diff --cached --quiet; then
            git commit -m 'build(tarifas): retain exact baseline and patched runtime surfaces'
            git pull --rebase origin fix/tarifas-panel-20260915
            git push origin HEAD:fix/tarifas-panel-20260915
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tarifas-sources
          path: |
            tests/tarifas/fixtures
            release/payload/tarifas-2
