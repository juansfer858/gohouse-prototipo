name: Current media backend check
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/current-media-backend-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check current deployed media backend
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          curl -fsS "$BASE/api/health" | tee /tmp/health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h.get('ok') is True and h.get('db') is True,h
          print('uploadMode=',h.get('uploadMode'))
          PY
          code=$(curl -sS -o /tmp/media -w "%{http_code}" "$BASE/api/public/uploads/not-a-real-media-id")
          echo "media404=$code"
          test "$code" = "404"
          code2=$(curl -sS -o /tmp/u -w "%{http_code}" -X POST "$BASE/api/upload-data-url" -H 'Content-Type: application/json' --data '{"dataUrl":"data:image/png;base64,iVBORw0KGgo="}')
          echo "uploadAnon=$code2"
          test "$code2" = "401"
