name: Verify published tariff release v27
on:
  pull_request:
    branches: [gohouse-vps-recovery]
    paths:
      - 'release/payload/tarifas-2/**'
      - '.github/workflows/verify-tariff-release.yml'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify retained v27 tariff payload syntax
        run: |
          node --check release/payload/tarifas-2/server/src/server.js
          node --check release/payload/tarifas-2/server/src/tarifas.js
          node --check release/payload/tarifas-2/web/gohouse-tarifas.js
          node --check release/payload/tarifas-2/web/gohouse-branding.js
          grep -q "El Chaquiro" release/payload/tarifas-2/migrations/005_tariff_contract.sql
          grep -q '"tarifa":1000' release/payload/tarifas-2/migrations/005_tariff_contract.sql
