name: Validate publicidad DB media v40
on:
  push:
    branches: ['fix/publicidad-db-media-20260919']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and media contract
        run: |
          node --check release/payload/publicidad-db-media-1/server/src/server.js
          grep -q "uploadMode:'postgres-media-v40'" release/payload/publicidad-db-media-1/server/src/server.js
          grep -q "INSERT INTO media_assets" release/payload/publicidad-db-media-1/server/src/server.js
          grep -q "/api/public/uploads/" release/payload/publicidad-db-media-1/server/src/server.js
          ! grep -q "fs.mkdir(uploadDir" release/payload/publicidad-db-media-1/server/src/server.js
          ! grep -q "path.join(uploadDir" release/payload/publicidad-db-media-1/server/src/server.js
      - name: Migration
        run: |
          psql -h 127.0.0.1 -U postgres -d test -v ON_ERROR_STOP=1 -f release/payload/publicidad-db-media-1/migrations/010_media_assets.sql
          psql -h 127.0.0.1 -U postgres -d test -Atc "select column_name from information_schema.columns where table_name='media_assets' order by ordinal_position" | tee /tmp/cols
          grep -q '^id$' /tmp/cols
          grep -q '^mime_type$' /tmp/cols
          grep -q '^bytes$' /tmp/cols
