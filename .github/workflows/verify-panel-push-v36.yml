name: Verify panel push v36
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/verify-panel-push-v36.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify published v36 without writes
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          for i in $(seq 1 36); do
            curl -fsS "$BASE/gohouse-push.js?release=20260919.36" -o /tmp/push.js || true
            curl -fsS "$BASE/gohouse-branding.js?release=20260919.36" -o /tmp/branding.js || true
            curl -fsS "$BASE/api/health" -o /tmp/health.json || true
            if grep -q "gh-panel-push-button" /tmp/push.js 2>/dev/null && grep -q "gohouse-push.js?v=20260919.36" /tmp/branding.js 2>/dev/null; then break; fi
            sleep 5
          done
          node --check /tmp/push.js
          node --check /tmp/branding.js
          grep -q "gh-panel-push-button" /tmp/push.js
          grep -q "Notificaciones activas" /tmp/push.js
          grep -q "Notificaciones bloqueadas" /tmp/push.js
          grep -q "showNotification" /tmp/push.js
          grep -q "gohouse-push.js?v=20260919.36" /tmp/branding.js
          curl -fsS "$BASE/api/push/public-key" -o /tmp/key.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          k=json.load(open('/tmp/key.json'))
          assert h.get('ok') is True and h.get('db') is True and h.get('push') is True, h
          assert len(str(k.get('publicKey',''))) > 40, k
          print('PASS: v36 panel push UI published; push backend ready; writes=0')
          PY
