name: Verify driver code viewer v30
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/verify-driver-code-view-v30.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published module without writes
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/gohouse-driver-codes.js?release=20260918.30" -o /tmp/codes.js && grep -q "Registrar código actual" /tmp/codes.js; then break; fi
            sleep 5
          done
          grep -q "Ver código" /tmp/codes.js
          node --check /tmp/codes.js
          curl -fsS "$BASE/gohouse-branding.js?release=20260918.30" -o /tmp/branding.js
          grep -q "gohouse-driver-codes.js" /tmp/branding.js
          curl -fsS "$BASE/api/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/health.json'))
          assert x.get('ok') is True and x.get('db') is True
          PY
          status=$(curl -sS -o /tmp/protected.json -w "%{http_code}" "$BASE/api/driver-codes/test")
          test "$status" = "401"
          echo "PASS: v30 published; viewer loaded; admin endpoint protected; writes=0"
