name: Validate panel freeze fix v38
on:
  push:
    branches: ['fix/panel-freeze-notification-loop-20260919']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and loop contract
        run: |
          node --check release/payload/panel-freeze-fix-1/web/gohouse-push.js
          node --check release/payload/panel-freeze-fix-1/web/gohouse-branding.js
          grep -q "if(btn.textContent!==label)" release/payload/panel-freeze-fix-1/web/gohouse-push.js
          grep -q "if(!\$('gh-panel-push-button')) ensurePanelButton();" release/payload/panel-freeze-fix-1/web/gohouse-push.js
          grep -q "gohouse-push.js?v=20260919.38" release/payload/panel-freeze-fix-1/web/gohouse-branding.js
          ! grep -q "MutationObserver(()=>ensurePanelButton())" release/payload/panel-freeze-fix-1/web/gohouse-push.js
