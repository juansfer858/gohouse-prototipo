name: Verify Gmail recovery v35
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/verify-gmail-recovery-v35.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify published v35 without writes
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          for i in $(seq 1 36); do
            curl -fsS "$BASE/api/health" -o /tmp/health.json || true
            curl -fsS "$BASE/gohouse-mail-config.js?release=20260919.35" -o /tmp/mail.js || true
            curl -fsS "$BASE/panel/" -o /tmp/panel.html || true
            if python3 - <<'PY'
          import json, pathlib, sys
          try:
            h=json.load(open('/tmp/health.json'))
            m=pathlib.Path('/tmp/mail.js').read_text()
            p=pathlib.Path('/tmp/panel.html').read_text()
            ok=(
              h.get('recoveryMailMode')=='gmail-app-password-v35'
              and 'Gmail / Google Workspace' in m
              and 'Contraseña de aplicación' in m
              and 'Enviar correo de prueba' in m
              and '/gohouse-mail-config.js?v=20260919.35' in p
            )
            sys.exit(0 if ok else 1)
          except Exception:
            sys.exit(1)
          PY
            then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json,pathlib
          h=json.load(open('/tmp/health.json'))
          m=pathlib.Path('/tmp/mail.js').read_text()
          p=pathlib.Path('/tmp/panel.html').read_text()
          assert h.get('ok') is True and h.get('db') is True
          assert h.get('recoveryMailMode')=='gmail-app-password-v35',h
          assert 'Gmail / Google Workspace' in m
          assert 'Contraseña de aplicación' in m
          assert 'Enviar correo de prueba' in m
          assert 'smtp.gmail.com' in m and 'puerto 587' in m
          assert '/gohouse-mail-config.js?v=20260919.35' in p
          print('health',h)
          PY
          code=$(curl -sS -o /tmp/private.json -w "%{http_code}" "$BASE/api/recovery-mail/settings")
          test "$code" = "401"
          curl -fsS "$BASE/api/public/config" -o /tmp/config.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/config.json'))
          assert x.get('brandName')=='AGUILAS EXPRES',x
          assert 'appPassword' not in x
          print('brand',x.get('brandName'))
          PY
          echo "PASS: v35 Gmail recovery published; private API protected; writes=0"
