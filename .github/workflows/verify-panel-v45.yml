name: Verify restored panel v45
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/verify-panel-v45.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify v45 in production without writes
        run: |
          set -euo pipefail
          BASE=https://domicilios-llanos.vantixgc.com
          for i in $(seq 1 48); do
            curl -fsS "$BASE/gohouse-panel.html?release=20260921.45" -o /tmp/panel.html || true
            if grep -q "gohouse-vps-adapter.js" /tmp/panel.html 2>/dev/null               && grep -q "gohouse-branding.js" /tmp/panel.html 2>/dev/null               && grep -q "async function cancelarPedidoPanel(orderId)" /tmp/panel.html 2>/dev/null               && ! grep -q "firebasejs" /tmp/panel.html 2>/dev/null; then
              break
            fi
            sleep 5
          done
          grep -q "gohouse-vps-adapter.js" /tmp/panel.html
          grep -q "gohouse-branding.js" /tmp/panel.html
          grep -q "async function cancelarPedidoPanel(orderId)" /tmp/panel.html
          grep -q "Cancelar pedido" /tmp/panel.html
          ! grep -q "firebasejs" /tmp/panel.html
          curl -fsS "$BASE/api/public/config" -o /tmp/config.json
          curl -fsS "$BASE/api/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          cfg=json.load(open('/tmp/config.json'))
          h=json.load(open('/tmp/health.json'))
          assert cfg.get('brandName')=='AGUILAS EXPRES',cfg
          assert h.get('ok') is True and h.get('db') is True,h
          print('PASS: v45 restored VPS panel; AGUILAS EXPRES; cancel action present; Firebase absent; writes=0')
          PY
