name: Validate publicidad upload hardpin v39
on:
  push:
    branches: ['fix/publicidad-upload-hardpin-20260919']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and hard-pin contract
        run: |
          node --check release/payload/publicidad-upload-hardpin-1/server/src/server.js
          grep -q "const PUBLIC_UPLOAD_DIR='/opt/gohouse/web/uploads'" release/payload/publicidad-upload-hardpin-1/server/src/server.js
          grep -q "uploadMode:'fixed-opt-gohouse-v39'" release/payload/publicidad-upload-hardpin-1/server/src/server.js
          grep -q "uploadStorageReady:uploadStorageReady()" release/payload/publicidad-upload-hardpin-1/server/src/server.js
          ! grep -q "config.uploadDir" release/payload/publicidad-upload-hardpin-1/server/src/server.js
          ! grep -q "GOHOUSE_UPLOAD_DIR" release/payload/publicidad-upload-hardpin-1/server/src/server.js
