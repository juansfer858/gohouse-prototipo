name: Verify delivery VPS

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - 'release/**'
      - '.github/workflows/verify-gohouse-vps.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for VPS autodeploy
        run: sleep 90

      - name: Verify health
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 15 \
            https://domicilios-llanos.vantixgc.com/api/health | tee /tmp/health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('ok') is True, data
          assert data.get('db') is True, data
          PY

      - name: Verify public white-label config
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 15 \
            https://domicilios-llanos.vantixgc.com/api/public/config | tee /tmp/brand.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/brand.json'))
          name=str(data.get('brandName','')).strip().lower()
          assert name and name not in {'go house','gohouse'}, data
          PY

      - name: Verify clean routes
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 15 \
            https://domicilios-llanos.vantixgc.com/ >/tmp/client.html
          curl --fail --show-error --silent --location --max-time 15 \
            https://domicilios-llanos.vantixgc.com/panel/ >/tmp/panel.html
          curl --fail --show-error --silent --location --max-time 15 \
            https://domicilios-llanos.vantixgc.com/domiciliario/ >/tmp/driver.html
          test -s /tmp/client.html
          test -s /tmp/panel.html
          test -s /tmp/driver.html

      - name: Verify white-label runtime
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 15 \
            https://domicilios-llanos.vantixgc.com/gohouse-branding.js >/tmp/branding.js
          grep -q "brandName: 'Domicilios'" /tmp/branding.js
          grep -q 'cleanVisibleRoute' /tmp/branding.js

      - name: Verify QR button and center
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 15 \
            https://domicilios-llanos.vantixgc.com/panel/ >/tmp/panel-wrapper.html
          grep -q 'tab-qr-public' /tmp/panel-wrapper.html
          grep -q "location.href=\\'/qr/\\'" /tmp/panel-wrapper.html
          curl --fail --show-error --silent --max-time 15 \
            https://domicilios-llanos.vantixgc.com/qr/ >/tmp/qr-center.html
          grep -q 'QR de pedidos' /tmp/qr-center.html
          grep -q 'Descargar historia' /tmp/qr-center.html
          grep -q 'Imprimir afiche' /tmp/qr-center.html

      - name: Verify rendered QR tab
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            timeout 25s google-chrome --headless --disable-gpu --no-sandbox --dump-dom \
              https://domicilios-llanos.vantixgc.com/panel/ >/tmp/panel-dom.html 2>/tmp/chrome.err || true
            grep -q 'id="tab-qr-public"' /tmp/panel-dom.html
          else
            echo 'google-chrome no disponible; verificación estática ya pasó.'
          fi
