name: Validate Gmail recovery v35
on:
  push:
    branches: ['feat/gmail-recovery-20260919']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check release/payload/gmail-recovery-1/server/src/server.js
          node --check release/payload/gmail-recovery-1/server/src/client-mail.js
          node --check release/payload/gmail-recovery-1/web/gohouse-mail-config.js
      - name: Security contracts
        run: |
          grep -q "aes-256-gcm" release/payload/gmail-recovery-1/server/src/client-mail.js
          grep -q "AUTH LOGIN" release/payload/gmail-recovery-1/server/src/client-mail.js
          grep -q "smtp.gmail.com" release/payload/gmail-recovery-1/server/src/client-mail.js
          grep -q "APP_PASSWORD_REQUIRED" release/payload/gmail-recovery-1/server/src/client-mail.js
          grep -q "hasAppPassword" release/payload/gmail-recovery-1/server/src/client-mail.js
          grep -q "requirePanelAdmin" release/payload/gmail-recovery-1/server/src/server.js
          ! grep -q "appPassword:" release/payload/gmail-recovery-1/server/src/client-mail.js
      - name: Migration
        run: |
          psql -h 127.0.0.1 -U postgres -d test <<'SQL'
          CREATE TABLE app_state(id integer PRIMARY KEY,data jsonb NOT NULL);
          INSERT INTO app_state VALUES (1,'{"gohouse-data":{"config":{"brandName":"AGUILAS EXPRES","recoveryFromName":"AGUILAS EXPRES","recoveryFromEmail":"no-reply@vantixgc.com","recoveryReplyTo":"soporte@vantixgc.com","recoveryMailEnabled":true}}}');
          SQL
          psql -h 127.0.0.1 -U postgres -d test -v ON_ERROR_STOP=1 -f release/payload/gmail-recovery-1/migrations/009_recovery_mail_settings.sql
          psql -h 127.0.0.1 -U postgres -d test -Atc "select provider,from_name,from_email,reply_to,enabled,app_password_enc from recovery_mail_settings where id=1" | tee /tmp/out
          grep -q "gmail|AGUILAS EXPRES|no-reply@vantixgc.com|soporte@vantixgc.com|f|" /tmp/out
