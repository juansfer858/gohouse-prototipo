name: Package driver documents v28
on:
  push:
    branches:
      - feat/driver-documents-20260917
    paths:
      - .github/workflows/package-driver-documents.yml
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/driver-documents-20260917
          fetch-depth: 0
      - name: Build manifest
        run: python3 tools/package-driver-documents.py
      - name: Validate JavaScript
        run: |
          node --check release/payload/driver-documents-1/server/src/server.js
          node --check release/payload/driver-documents-1/server/src/driver-documents.js
          node --check release/payload/driver-documents-1/web/gohouse-branding.js
          node --check release/payload/driver-documents-1/web/gohouse-driver-documents.js
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/version.json release/DRIVER_DOCUMENTS_V28.md
          git commit -m "release(v28): private driver documents and expiry control"
          git pull --rebase origin feat/driver-documents-20260917
          git push origin HEAD:feat/driver-documents-20260917
