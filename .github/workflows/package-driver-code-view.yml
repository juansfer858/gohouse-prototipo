name: Package driver code viewer v30
on:
  push:
    branches: ['feat/driver-code-view-20260918']
    paths: ['.github/workflows/package-driver-code-view.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/driver-code-view-20260918
          fetch-depth: 0
      - name: Build manifest
        run: |
          python3 - <<'PY'
          import json,hashlib,subprocess,pathlib
          source='3e8e7d2b8a5a189bc312a094cc5cfbe96d5b8a1f'
          prefix='release/payload/driver-code-view-1/'
          files=['server/src/server.js','web/gohouse-branding.js','web/gohouse-driver-codes.js']
          migration='migrations/008_driver_access_codes.sql'
          def item(p):
              b=subprocess.check_output(['git','show',source+':'+prefix+p])
              assert pathlib.Path(prefix+p).read_bytes()==b
              return {'path':p,'url':'https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/'+source+'/'+prefix+p,'sha256':hashlib.sha256(b).hexdigest()}
          m={'version':'2026.09.18-white-label.30','published_at':'2026-09-18T17:08:00Z','status':'release','files':[item(p) for p in files],'delete':[],'migrations':[item(migration)]}
          pathlib.Path('release/version.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('release/DRIVER_CODE_VIEW_V30.md').write_text("""# V30 · consulta administrativa del código del domiciliario

- Botón 🔑 Ver código junto a cada domiciliario.
- Nuevos domiciliarios: el código se registra para consulta al crearlos.
- Domiciliarios existentes: se registra una sola vez el código actual después de validarlo; no se modifica.
- Solo administrador puede consultar o registrar códigos.
- Eliminar al domiciliario elimina también la copia administrativa del código.
- El código de acceso sigue siendo inmutable mientras el domiciliario exista.
""")
          PY
      - name: Validate
        run: |
          node --check release/payload/driver-code-view-1/server/src/server.js
          node --check release/payload/driver-code-view-1/web/gohouse-branding.js
          node --check release/payload/driver-code-view-1/web/gohouse-driver-codes.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/version.json release/DRIVER_CODE_VIEW_V30.md
          git commit -m 'release(v30): admin driver code viewer'
          git pull --rebase origin feat/driver-code-view-20260918
          git push origin HEAD:feat/driver-code-view-20260918
