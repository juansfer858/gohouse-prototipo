name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate client account and recovery payload
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/client-auth-1
          curl -fsSL "$BASE/server/src/client-auth.js" -o /tmp/client-auth.js
          curl -fsSL "$BASE/server/src/client-mail.js" -o /tmp/client-mail.js
          curl -fsSL "$BASE/server/src/server.js" -o /tmp/server.js
          curl -fsSL "$BASE/web/gohouse-client-auth.js" -o /tmp/client-ui.js
          curl -fsSL "$BASE/web/gohouse-push.js" -o /tmp/push.js
          curl -fsSL "$BASE/migrations/002_client_accounts.sql" -o /tmp/migration.sql
          node --check /tmp/client-auth.js
          node --check /tmp/client-mail.js
          node --check /tmp/server.js
          node --check /tmp/client-ui.js
          node --check /tmp/push.js
          grep -q '/api/auth/client/register' /tmp/server.js
          grep -q '/api/auth/client/login' /tmp/server.js
          grep -q '/api/auth/client/recover' /tmp/server.js
          grep -q '/api/auth/client/reset' /tmp/server.js
          grep -q 'clientRecoveryMail' /tmp/server.js
          grep -q 'RESEND_API_KEY' /tmp/client-mail.js
          grep -q 'Olvidé mi contraseña' /tmp/client-ui.js
          grep -q 'Crear mi cuenta' /tmp/client-ui.js
          grep -q 'gohouse-client-auth.js' /tmp/push.js
          grep -q 'CREATE TABLE IF NOT EXISTS client_accounts' /tmp/migration.sql
          echo 'CLIENT_AUTH_SHA='; sha256sum /tmp/client-auth.js
          echo 'CLIENT_MAIL_SHA='; sha256sum /tmp/client-mail.js
          echo 'SERVER_SHA='; sha256sum /tmp/server.js
          echo 'CLIENT_UI_SHA='; sha256sum /tmp/client-ui.js
          echo 'PUSH_SHA='; sha256sum /tmp/push.js
          echo 'MIGRATION_SHA='; sha256sum /tmp/migration.sql
