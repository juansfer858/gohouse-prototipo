name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate explicit GPS permission payload
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/fleet-2/web/gohouse-fleet-driver.js
          curl -fsSL "$URL" -o /tmp/driver.js
          node --check /tmp/driver.js
          grep -q 'ACTIVAR UBICACIÓN' /tmp/driver.js
          grep -q 'requestLocationPermission' /tmp/driver.js
          grep -q "permissions.query({name:'geolocation'})" /tmp/driver.js
          grep -q 'watchPosition' /tmp/driver.js
          grep -q "sendPoint(activeOrderId,'track',point)" /tmp/driver.js
          grep -q 'Se comparte únicamente mientras tengas un domicilio activo' /tmp/driver.js
          echo 'DRIVER_GPS_PERMISSION_SHA='; sha256sum /tmp/driver.js
