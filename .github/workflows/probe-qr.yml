name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate complete Web Push payload
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/push-1
          curl -fsSL "$BASE/web/gohouse-push.js" -o /tmp/push-client.js
          curl -fsSL "$BASE/web/service-worker.js" -o /tmp/sw.js
          curl -fsSL "$BASE/web/gohouse-branding.js" -o /tmp/branding.js
          curl -fsSL "$BASE/server/src/push.js" -o /tmp/push-server.js
          node --check /tmp/push-client.js
          node --check /tmp/sw.js
          node --check /tmp/branding.js
          node --check /tmp/push-server.js
          grep -q 'Notification.requestPermission' /tmp/push-client.js
          grep -q '/api/push/subscribe' /tmp/push-client.js
          grep -q "addEventListener('push'" /tmp/sw.js
          grep -q "addEventListener('notificationclick'" /tmp/sw.js
          grep -q 'notifyClientChats' /tmp/push-server.js
          grep -q 'Comprobante recibido' /tmp/push-server.js
          grep -q 'white-label-push-script' /tmp/branding.js
          echo 'CLIENT_PUSH_SHA='; sha256sum /tmp/push-client.js
          echo 'SW_SHA='; sha256sum /tmp/sw.js
          echo 'BRANDING_SHA='; sha256sum /tmp/branding.js
          echo 'SERVER_PUSH_SHA='; sha256sum /tmp/push-server.js
