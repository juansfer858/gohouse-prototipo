name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate guided PWA install payload
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/pwa-install-1/web
          curl -fsSL "$BASE/gohouse-install.js" -o /tmp/install.js
          curl -fsSL "$BASE/gohouse-branding.js" -o /tmp/branding.js
          node --check /tmp/install.js
          node --check /tmp/branding.js
          grep -q 'beforeinstallprompt' /tmp/install.js
          grep -q 'Agregar a pantalla de inicio' /tmp/install.js
          grep -q 'display-mode: standalone' /tmp/install.js
          grep -q 'white-label-install-script' /tmp/branding.js
          grep -q '/api/manifest.webmanifest?app=' /tmp/branding.js
          echo 'INSTALL_SHA='
          sha256sum /tmp/install.js
          echo 'BRANDING_SHA='
          sha256sum /tmp/branding.js
