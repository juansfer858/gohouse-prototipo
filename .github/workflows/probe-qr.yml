name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hash client advertising visibility fix
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/publicidad-4/server/src/store.js
          curl -fsSL "$URL" -o /tmp/store.js
          node --check /tmp/store.js
          grep -q 'publicAdvertising' /tmp/store.js
          grep -q 'publicidad: publicAdvertising(g)' /tmp/store.js
          echo 'STORE_SHA='
          sha256sum /tmp/store.js
