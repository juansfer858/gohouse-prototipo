name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate tariff zones payload
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/tarifas-1
          curl -fsSL "$BASE/web/gohouse-tarifas.js" -o /tmp/tarifas.js
          curl -fsSL "$BASE/web/gohouse-branding.js" -o /tmp/branding.js
          curl -fsSL "$BASE/migrations/004_tariff_zones.sql" -o /tmp/tarifas.sql
          node --check /tmp/tarifas.js
          node --check /tmp/branding.js
          grep -q '+ Agregar referencia' /tmp/tarifas.js
          grep -q 'Servicio estándar' /tmp/tarifas.sql
          grep -q 'Vallecitos' /tmp/tarifas.sql
          grep -q 'Santa Rosa' /tmp/tarifas.sql
          grep -q 'Yarula' /tmp/tarifas.sql
          grep -q 'San José' /tmp/tarifas.sql
          grep -q '"tarifa":50000' /tmp/tarifas.sql
          grep -q 'zonaTarifaId' /tmp/tarifas.js
          grep -q 'tarifaFijada' /tmp/tarifas.js
          grep -q 'white-label-tarifas-script' /tmp/branding.js
          grep -q '/gohouse-tarifas.js' /tmp/branding.js
          echo 'TARIFFS_SHA='; sha256sum /tmp/tarifas.js
          echo 'BRANDING_SHA='; sha256sum /tmp/branding.js
          echo 'MIGRATION_SHA='; sha256sum /tmp/tarifas.sql
