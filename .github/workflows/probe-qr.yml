name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Google Workspace recovery mail payload
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/mail-config-1
          curl -fsSL "$BASE/server/src/client-mail.js" -o /tmp/client-mail.js
          curl -fsSL "$BASE/web/gohouse-mail-config.js" -o /tmp/mail-ui.js
          curl -fsSL "$BASE/web/panel/index.html" -o /tmp/panel.html
          node --check /tmp/client-mail.js
          node --check /tmp/mail-ui.js
          grep -q 'smtp-relay.gmail.com' /tmp/client-mail.js
          grep -q "smtp.write('STARTTLS')" /tmp/client-mail.js
          grep -q 'recoveryMailEnabled' /tmp/client-mail.js
          grep -q 'Correo y recuperación' /tmp/mail-ui.js
          grep -q 'recoveryFromEmail' /tmp/mail-ui.js
          grep -q 'gohouse-mail-config.js' /tmp/panel.html
          echo 'CLIENT_MAIL_SHA='; sha256sum /tmp/client-mail.js
          echo 'MAIL_UI_SHA='; sha256sum /tmp/mail-ui.js
          echo 'PANEL_WRAPPER_SHA='; sha256sum /tmp/panel.html
