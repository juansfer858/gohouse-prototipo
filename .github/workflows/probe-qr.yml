name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Diagnose live panel bridge
        run: |
          set -u
          HOST=https://domicilios-llanos.vantixgc.com
          curl -fsSL "$HOST/panel/" -o /tmp/panel.html
          echo '=== MATCHES ==='
          grep -nE 'QR pedidos y operadores|window\.loadShared=async function|window\.saveShared=async function|tab-qr-public|tab-publicidad' /tmp/panel.html || true
          echo '=== COUNTS ==='
          echo "qr_label=$(grep -c 'QR pedidos y operadores' /tmp/panel.html || true)"
          echo "load_bridge=$(grep -c 'window.loadShared=async function' /tmp/panel.html || true)"
          echo "save_bridge=$(grep -c 'window.saveShared=async function' /tmp/panel.html || true)"
          echo "public_id=$(grep -o 'id=\"tab-qr-public\"' /tmp/panel.html | wc -l)"
          echo "ads_id=$(grep -o 'id=\"tab-publicidad\"' /tmp/panel.html | wc -l)"
