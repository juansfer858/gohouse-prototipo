name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate isolated live fleet payload
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/fleet-1
          curl -fsSL "$BASE/server/src/fleet.js" -o /tmp/fleet.js
          curl -fsSL "$BASE/server/src/server.js" -o /tmp/server.js
          curl -fsSL "$BASE/web/gohouse-fleet-driver.js" -o /tmp/driver.js
          curl -fsSL "$BASE/web/gohouse-fleet-panel.js" -o /tmp/panel.js
          curl -fsSL "$BASE/web/domiciliario/index.html" -o /tmp/driver-wrapper.html
          curl -fsSL "$BASE/web/panel/index.html" -o /tmp/panel-wrapper.html
          curl -fsSL "$BASE/migrations/003_driver_locations.sql" -o /tmp/fleet.sql
          node --check /tmp/fleet.js
          node --check /tmp/server.js
          node --check /tmp/driver.js
          node --check /tmp/panel.js
          grep -q "/api/fleet/location" /tmp/server.js
          grep -q "/api/fleet/live" /tmp/server.js
          grep -q "/api/fleet/history/:driverId" /tmp/server.js
          grep -q "principal?.type!=='driver'" /tmp/fleet.js
          grep -q "principal?.type!=='panel'" /tmp/fleet.js
          grep -q "watchPosition" /tmp/driver.js
          grep -q "Ya recogí / compré" /tmp/driver.js
          grep -q "Flota en vivo" /tmp/panel.js
          grep -q "openstreetmap.org" /tmp/panel.js
          grep -q "gohouse-fleet-driver.js" /tmp/driver-wrapper.html
          grep -q "gohouse-fleet-panel.js" /tmp/panel-wrapper.html
          grep -q "CREATE TABLE IF NOT EXISTS driver_location_events" /tmp/fleet.sql
          grep -q "CREATE TABLE IF NOT EXISTS driver_last_location" /tmp/fleet.sql
          echo 'FLEET_SHA='; sha256sum /tmp/fleet.js
          echo 'SERVER_SHA='; sha256sum /tmp/server.js
          echo 'DRIVER_SHA='; sha256sum /tmp/driver.js
          echo 'PANEL_SHA='; sha256sum /tmp/panel.js
          echo 'DRIVER_WRAPPER_SHA='; sha256sum /tmp/driver-wrapper.html
          echo 'PANEL_WRAPPER_SHA='; sha256sum /tmp/panel-wrapper.html
          echo 'MIGRATION_SHA='; sha256sum /tmp/fleet.sql
