name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify panel navigation fix in production
        run: |
          set -euo pipefail
          HOST=https://domicilios-llanos.vantixgc.com
          EXPECT=f12560f4415d5307b9cc4c6ad9438b035eb955aa275c55be1887db57c9dae5af
          READY=0
          for attempt in $(seq 1 28); do
            if curl -fsSL "$HOST/gohouse-panel-nav.js" -o /tmp/nav.js 2>/dev/null; then
              GOT="$(sha256sum /tmp/nav.js | awk '{print $1}')"
              echo "attempt=$attempt nav_sha=$GOT"
              if [ "$GOT" = "$EXPECT" ]; then READY=1; break; fi
            else
              echo "attempt=$attempt nav_not_ready"
            fi
            sleep 15
          done
          test "$READY" -eq 1
          node --check /tmp/nav.js
          grep -q 'restoreNative' /tmp/nav.js
          grep -q 'requestAnimationFrame' /tmp/nav.js

          curl -fsSL "$HOST/panel/" -o /tmp/panel-wrapper.html
          grep -q 'gohouse-panel-nav.js' /tmp/panel-wrapper.html

          BROWSER=""
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then BROWSER="$c"; break; fi
          done
          test -n "$BROWSER"
          timeout 35s "$BROWSER" --headless --disable-gpu --no-sandbox --window-size=1280,800 --virtual-time-budget=9000 --dump-dom \
            "$HOST/panel/" >/tmp/panel-dom.html 2>/tmp/panel-browser.err || true
          grep -q 'gohouse-panel-nav.js' /tmp/panel-dom.html
          grep -q 'id="tab-pedidos"' /tmp/panel-dom.html
          grep -q 'id="tab-informes"' /tmp/panel-dom.html
          grep -q 'id="tab-usuarios"' /tmp/panel-dom.html
          grep -q 'id="tab-mensajes"' /tmp/panel-dom.html
          grep -q 'id="tab-publicidad"' /tmp/panel-dom.html
          echo 'LIVE_PANEL_NAV_FIX_OK=true'
