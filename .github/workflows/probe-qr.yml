name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify Google Workspace recovery mail in production
        run: |
          set -euo pipefail
          HOST=https://domicilios-llanos.vantixgc.com
          EXPECT_MAIL=d5c4798294de7ebbd997630fa7f35588b4d3761238b3fca567cd6e11da4cef07
          EXPECT_UI=42dae388b94c78cd9008902d3dae2f3813d5a975729e6302cbb438398305c72f
          READY=0
          for attempt in $(seq 1 36); do
            if curl -fsSL "$HOST/gohouse-mail-config.js" -o /tmp/mail-ui.js 2>/dev/null && curl -fsSL "$HOST/panel/" -o /tmp/panel.html 2>/dev/null; then
              U="$(sha256sum /tmp/mail-ui.js | awk '{print $1}')"
              echo "attempt=$attempt ui=$U"
              if [ "$U" = "$EXPECT_UI" ] && grep -q 'gohouse-mail-config.js' /tmp/panel.html; then READY=1; break; fi
            fi
            sleep 10
          done
          test "$READY" -eq 1
          node --check /tmp/mail-ui.js
          grep -q 'Correo y recuperación' /tmp/mail-ui.js
          grep -q 'Google Workspace' /tmp/mail-ui.js
          grep -q 'recoveryFromEmail' /tmp/mail-ui.js
          curl -fsSL "$HOST/api/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h.get('ok') is True and h.get('db') is True, h
          PY
          echo 'LIVE_MAIL_CONFIG_UI_OK=true'
          echo 'LIVE_GOOGLE_WORKSPACE_RELAY_READY_FOR_ADMIN_SETUP=true'
