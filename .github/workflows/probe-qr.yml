name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe production after white-label 11
        run: |
          set -u
          echo '=== PANEL WRAPPER ==='
          curl -sS -o /tmp/panel -w 'HTTP=%{http_code}\n' https://domicilios-llanos.vantixgc.com/panel/
          grep -n 'tab-qr-public' /tmp/panel || true
          grep -n '/qr/' /tmp/panel || true
          echo '=== QR CENTER ==='
          curl -sS -o /tmp/qr -w 'HTTP=%{http_code}\n' https://domicilios-llanos.vantixgc.com/qr/
          grep -n 'QR de pedidos' /tmp/qr | head -5 || true
          grep -n 'Descargar historia' /tmp/qr | head -5 || true
          grep -n 'Imprimir afiche' /tmp/qr | head -5 || true
          echo '=== PANEL SOURCE ==='
          sed -n '1,70p' /tmp/panel
