name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate panel navigation payload
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/panel-nav-1/web
          curl -fsSL "$BASE/gohouse-panel-nav.js" -o /tmp/nav.js
          curl -fsSL "$BASE/panel/index.html" -o /tmp/panel.html
          node --check /tmp/nav.js
          grep -q 'restoreNative' /tmp/nav.js
          grep -q 'tab-pedidos' /tmp/nav.js
          grep -q 'tab-informes' /tmp/nav.js
          grep -q 'tab-usuarios' /tmp/nav.js
          grep -q 'tab-ajustes' /tmp/nav.js
          grep -q 'gohouse-panel-nav.js' /tmp/panel.html
          echo 'NAV_SHA='; sha256sum /tmp/nav.js
          echo 'PANEL_WRAPPER_SHA='; sha256sum /tmp/panel.html
