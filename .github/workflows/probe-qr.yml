name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify explicit GPS permission in production
        run: |
          set -euo pipefail
          HOST=https://domicilios-llanos.vantixgc.com
          EXPECT=2760f3370db76197d1347dfed572e4f8d49e00868f04de2c8c2e00a8fe7dbff5
          READY=0
          for attempt in $(seq 1 36); do
            if curl -fsSL "$HOST/gohouse-fleet-driver.js" -o /tmp/driver.js 2>/dev/null; then
              SHA="$(sha256sum /tmp/driver.js | awk '{print $1}')"
              echo "attempt=$attempt sha=$SHA"
              if [ "$SHA" = "$EXPECT" ]; then READY=1; break; fi
            fi
            sleep 10
          done
          test "$READY" -eq 1
          node --check /tmp/driver.js
          grep -q 'ACTIVAR UBICACIÓN' /tmp/driver.js
          grep -q 'requestLocationPermission' /tmp/driver.js
          grep -q "permissions.query({name:'geolocation'})" /tmp/driver.js
          grep -q 'Ubicación bloqueada' /tmp/driver.js
          grep -q 'watchPosition' /tmp/driver.js
          curl -fsSL "$HOST/api/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h.get('ok') is True and h.get('db') is True and h.get('fleet') is True, h
          PY
          echo 'LIVE_EXPLICIT_GPS_PERMISSION_OK=true'
          echo 'LIVE_FLEET_STILL_OK=true'
