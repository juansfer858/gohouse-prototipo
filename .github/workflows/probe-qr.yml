name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate GPS render-loop hotfix
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/fleet-3/web/gohouse-fleet-driver.js
          curl -fsSL "$URL" -o /tmp/driver.js
          node --check /tmp/driver.js
          grep -q 'ACTIVAR UBICACIÓN' /tmp/driver.js
          grep -q 'requestLocationPermission' /tmp/driver.js
          grep -q 'lastCardKey' /tmp/driver.js
          grep -q 'new MutationObserver(() => patchActions())' /tmp/driver.js
          ! grep -q 'new MutationObserver(()=>{patchActions();renderPermissionCard();})' /tmp/driver.js
          grep -q 'SOLICITANDO UBICACIÓN' /tmp/driver.js
          grep -q 'watchPosition' /tmp/driver.js
          echo 'GPS_HOTFIX_SHA='; sha256sum /tmp/driver.js
