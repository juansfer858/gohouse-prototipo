name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate Publicidad reopen fix payload
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/panel-nav-2/web/gohouse-panel-nav.js
          curl -fsSL "$URL" -o /tmp/nav.js
          node --check /tmp/nav.js
          grep -q "ads.style.removeProperty('display')" /tmp/nav.js
          grep -q "window.GoHouseAds?.openPanel?.()" /tmp/nav.js
          echo 'NAV_SHA='
          sha256sum /tmp/nav.js
