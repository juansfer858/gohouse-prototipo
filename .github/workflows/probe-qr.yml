name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify live panel bridge and unified QR
        run: |
          set -euo pipefail
          sleep 25
          HOST=https://domicilios-llanos.vantixgc.com
          curl -fsSL "$HOST/panel/" -o /tmp/panel.html
          grep -q 'QR pedidos y operadores' /tmp/panel.html
          grep -q 'window.loadShared=async function' /tmp/panel.html
          grep -q 'window.saveShared=async function' /tmp/panel.html
          test "$(grep -o 'id="tab-qr-public"' /tmp/panel.html | wc -l)" -eq 0
          grep -q 'id="tab-publicidad"' /tmp/panel.html
          echo 'LIVE_PANEL_BRIDGE_OK=true'
