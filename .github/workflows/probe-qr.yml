name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect live VPS adapter API
        run: |
          set -euo pipefail
          curl -fsSL https://domicilios-llanos.vantixgc.com/gohouse-vps-adapter.js -o /tmp/adapter
          echo '=== API ENDPOINTS ==='
          grep -oE "'/api/[^']+|\"/api/[^\"]+" /tmp/adapter | sort -u || true
          echo '=== LOAD SAVE ==='
          grep -nE 'loadShared|saveShared|upload-data-url|api/state' /tmp/adapter | head -80 || true
