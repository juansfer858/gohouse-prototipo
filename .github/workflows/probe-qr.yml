name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hash advertising retry payload
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/publicidad-5/web/gohouse-publicidad.js
          curl -fsSL "$URL" -o /tmp/ads.js
          node --check /tmp/ads.js
          grep -q '700, 1800, 3500, 6500' /tmp/ads.js
          echo 'ADS_RETRY_SHA='
          sha256sum /tmp/ads.js
