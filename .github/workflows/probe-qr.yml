name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hash driver QR payload
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/qr-3/web/qr/index.html -o /tmp/qr3
          echo 'QR3_SHA='
          sha256sum /tmp/qr3
          grep -q 'QR domiciliarios' /tmp/qr3
          grep -q "new URL('/domiciliario/'" /tmp/qr3

      - name: Verify live receipt flow
        run: |
          set -euo pipefail
          curl -fsSL https://domicilios-llanos.vantixgc.com/gohouse-cliente.html -o /tmp/client
          curl -fsSL https://domicilios-llanos.vantixgc.com/gohouse-vps-adapter.js -o /tmp/adapter
          grep -q 'comprobanteEntregaDataUrl' /tmp/client
          grep -q 'orden.comprobante' /tmp/client
          grep -q 'upload-data-url' /tmp/adapter
          echo 'LIVE_RECEIPT_FLOW_OK=true'
