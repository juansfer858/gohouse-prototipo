name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hash panel advertising fix
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/juansfer858/gohouse-prototipo/gohouse-vps-recovery/release/payload/publicidad-2/web/panel/index.html
          curl -fsSL "$URL" -o /tmp/panel.html
          grep -q 'QR pedidos y operadores' /tmp/panel.html
          grep -q 'window.loadShared=async function' /tmp/panel.html
          grep -q 'window.saveShared=async function' /tmp/panel.html
          grep -q 'tab-qr-public' /tmp/panel.html
          echo 'PANEL_FIX_SHA='
          sha256sum /tmp/panel.html
