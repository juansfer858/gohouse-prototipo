name: Probe QR production

on:
  push:
    branches: [gohouse-vps-recovery]
    paths:
      - '.github/workflows/probe-qr.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect live app shell baselines
        run: |
          set -euo pipefail
          HOST=https://domicilios-llanos.vantixgc.com
          curl -fsSL "$HOST/gohouse-cliente.html" -o /tmp/client.html
          curl -fsSL "$HOST/gohouse-panel.html" -o /tmp/panel.html
          curl -fsSL "$HOST/gohouse-domiciliarios.html" -o /tmp/driver.html
          echo 'CLIENT'; wc -c /tmp/client.html; sha256sum /tmp/client.html
          echo 'PANEL'; wc -c /tmp/panel.html; sha256sum /tmp/panel.html
          echo 'DRIVER'; wc -c /tmp/driver.html; sha256sum /tmp/driver.html
          echo 'CHAT_CLIENT'; grep -nE 'chat-soporte-btn|enviarMensajeChatSoporte|chatsClientes' /tmp/client.html | head -20 || true
          echo 'CHAT_PANEL'; grep -nE 'abrirChatConCliente|chatsClientes|monitorearCambiosChat' /tmp/panel.html | head -30 || true
