name: Diagnose v29 migration
on:
  push:
    branches: [gohouse-vps-recovery]
    paths: ['.github/workflows/diagnose-v29-migration.yml']
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create real app_state shape
        run: |
          psql -h 127.0.0.1 -U postgres -d test <<'SQL'
          CREATE TABLE app_state(id integer PRIMARY KEY, data jsonb NOT NULL, version bigint NOT NULL DEFAULT 1, updated_at timestamptz NOT NULL DEFAULT now());
          INSERT INTO app_state(id,data) VALUES (1,'{"gohouse-data":{"config":{"brandName":"GO! HOUSE","shortName":"GoHouse","legalName":"GO HOUSE Mensajería","supportText":"Bienvenido a GO! HOUSE","porcentajeCasa":30,"tarifasZonas":[{"id":"estandar","nombre":"Servicio estándar","tarifa":4000,"activa":true,"predeterminada":true,"orden":1}]},"orders":[]}}');
          SQL
      - name: Install current tariff guard
        run: psql -h 127.0.0.1 -U postgres -d test -v ON_ERROR_STOP=1 -f release/payload/tarifas-2/migrations/005_tariff_contract.sql
      - name: Apply v29 migration
        run: psql -h 127.0.0.1 -U postgres -d test -v ON_ERROR_STOP=1 -f release/payload/brand-driver-code-1/migrations/007_brand_driver_code.sql
      - name: Verify
        run: |
          psql -h 127.0.0.1 -U postgres -d test -Atc "select data#>>'{gohouse-data,config,brandName}',data#>>'{gohouse-data,config,shortName}',data#>>'{gohouse-data,config,legalName}',data#>>'{gohouse-data,config,supportText}' from app_state where id=1"
